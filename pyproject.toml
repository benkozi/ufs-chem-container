[project]
name = "ufs-chem-container"
version = "0.3.0-rc.1"
description = "Container images for UFS Chemistry"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/ufs-community/ufs-chem-container"
Repository = "https://github.com/ufs-community/ufs-chem-container"
Issues = "https://github.com/ufs-community/ufs-chem-container/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
    "vulture>=2.14",
    "yamlfix>=1.16",
    "yamllint>=1.35",
]

[tool.ruff]
line-length = 120

[tool.mypy]
files = [".github/workflows/scripts"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.vulture]
paths = [".github/workflows/scripts"]
min_confidence = 80

[tool.yamlfix]
explicit_start = false
sequence_style = "block_style"
line_length = 120

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = []
upload_to_pypi = false
build_command = """
pip install uv
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""
allow_zero_version = true
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
vcs_release = true

[tool.semantic_release.commit_parser_options]
# Parse only the squash-merge subject (the PR title). PSR v10 defaults this to
# true and would otherwise turn every conventional-looking bullet in a squash
# body into its own changelog entry and version-bump candidate.
parse_squash_commits = false

[tool.semantic_release.changelog]
exclude_commit_patterns = [".*\\n\\nAutomatically\\ generated\\ by\\ python\\-semantic\\-release.*$"]

[tool.semantic_release.branches.main]
match = "(^main$)"
prerelease = false

[tool.semantic_release.branches.develop]
match = "(^develop$)"
prerelease = true
prerelease_token = "rc"
