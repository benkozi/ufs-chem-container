name: Semantic Release
on:
  workflow_call:
    inputs:
      dry_run:
        description: Run in preview / no-operation mode without tagging or pushing
        required: false
        type: boolean
        default: false
      target_branch:
        description: Target branch name for evaluating release rules (e.g. develop, main)
        required: false
        type: string
        default: ''
      pr_title:
        description: Pull Request title representing the squash merge commit message
        required: false
        type: string
        default: ''
    outputs:
      new_release_version:
        description: The version of the new release
        value: ${{ jobs.release.outputs.new_release_version }}
      new_release_published:
        description: Whether a new release was published
        value: ${{ jobs.release.outputs.new_release_published }}
      is_prerelease:
        description: Whether this is a pre-release
        value: ${{ jobs.release.outputs.is_prerelease }}
      tag:
        description: The Git tag of the release
        value: ${{ jobs.release.outputs.tag }}
jobs:
  verify-credentials:
    name: Verify Semantic Release Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Validate secrets presence
        id: check
        env:
          SEMVER_APP_ID: ${{ secrets.SEMVER_APP_ID }}
          SEMVER_APP_PRIVATE_KEY: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}
        run: |
          python3 .github/workflows/scripts/verify_semantic_release_credentials.py check-secrets \
            ${{ (inputs.dry_run || github.event_name == 'pull_request') && '--allow-missing' || '' }}
      - name: Generate GitHub App Token
        if: steps.check.outputs.skip_verification != 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SEMVER_APP_ID }}
          private-key: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}
      - name: Verify repository write and ref permissions
        if: steps.check.outputs.skip_verification != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          APP_ID: ${{ secrets.SEMVER_APP_ID }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          python3 .github/workflows/scripts/verify_semantic_release_credentials.py check-permissions \
            --branches "${{ inputs.target_branch || github.base_ref || github.ref_name }}"
  release:
    name: Semantic Release
    needs:
      - verify-credentials
    runs-on: ubuntu-latest
    outputs:
      new_release_version: ${{ steps.release.outputs.version }}
      new_release_published: ${{ steps.release.outputs.released }}
      is_prerelease: ${{ steps.eval.outputs.is_prerelease }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        if: ${{ secrets.SEMVER_APP_ID != '' && secrets.SEMVER_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SEMVER_APP_ID }}
          private-key: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: true
      - name: Prepare branch for release evaluation
        if: inputs.dry_run || github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ inputs.pr_title }}
          TARGET: ${{ inputs.target_branch || github.base_ref || github.ref_name }}
        run: |
          python3 .github/workflows/scripts/prepare_release_preview.py
      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v10
        id: release
        with:
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          commit: ${{ !(inputs.dry_run || github.event_name == 'pull_request') }}
          tag: ${{ !(inputs.dry_run || github.event_name == 'pull_request') }}
          push: ${{ !(inputs.dry_run || github.event_name == 'pull_request') }}
          vcs_release: ${{ !(inputs.dry_run || github.event_name == 'pull_request') }}
      - name: Evaluate and Report Release
        id: eval
        if: always()
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASED: ${{ steps.release.outputs.released }}
          TARGET: ${{ inputs.target_branch || github.base_ref || github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run || github.event_name == 'pull_request' }}
          DOCKER_ORG: ${{ secrets.DOCKER_ORG || 'noaaepic' }}
        run: |-
          python3 .github/workflows/scripts/report_release.py
