name: Semantic Release
on:
  workflow_call:
    inputs:
      dry_run:
        description: Run in preview / no-operation mode without tagging or pushing
        required: false
        type: boolean
        default: false
      target_branch:
        description: Target branch name for evaluating release rules (e.g. develop, main)
        required: false
        type: string
        default: ''
    outputs:
      new_release_version:
        description: The version of the new release
        value: ${{ jobs.release.outputs.new_release_version }}
      new_release_published:
        description: Whether a new release was published
        value: ${{ jobs.release.outputs.new_release_published }}
      is_prerelease:
        description: Whether this is a pre-release
        value: ${{ jobs.release.outputs.is_prerelease }}
      tag:
        description: The Git tag of the release
        value: ${{ jobs.release.outputs.tag }}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    outputs:
      new_release_version: ${{ steps.release.outputs.version }}
      new_release_published: ${{ steps.release.outputs.released }}
      is_prerelease: ${{ steps.eval.outputs.is_prerelease }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        if: ${{ env.HAS_APP_ID == 'true' }}
        env:
          HAS_APP_ID: ${{ secrets.SEMVER_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          client-id: ${{ secrets.SEMVER_APP_ID }}
          private-key: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - name: Prepare branch for release evaluation
        if: inputs.dry_run || github.event_name == 'pull_request'
        run: |
          TARGET="${{ inputs.target_branch || github.base_ref || github.ref_name }}"
          echo "Evaluating release against target branch: $TARGET"
          git checkout -B "$TARGET"
      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v10
        id: release
        with:
          github_token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          no_operation_mode: ${{ inputs.dry_run || github.event_name == 'pull_request' }}
      - name: Evaluate Release Information
        id: eval
        if: always()
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          RELEASED="${{ steps.release.outputs.released }}"
          TARGET="${{ inputs.target_branch || github.base_ref || github.ref_name }}"
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *"-"* ]] || [[ "$TARGET" == "develop" ]]; then
            IS_PRERELEASE="true"
          fi
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET" >> "$GITHUB_OUTPUT"
      - name: Report Release Actions
        if: always()
        run: |
          TARGET="${{ steps.eval.outputs.target_branch }}"
          VERSION="${{ steps.release.outputs.version }}"
          TAG="${{ steps.release.outputs.tag }}"
          RELEASED="${{ steps.release.outputs.released }}"
          IS_PRERELEASE="${{ steps.eval.outputs.is_prerelease }}"
          ORG="${{ vars.DOCKER_ORG || 'bkrlps' }}"
          {
            echo "### 🚀 Semantic Release Plan"
            if [ "${{ inputs.dry_run || github.event_name == 'pull_request' }}" = "true" ]; then
              echo "**Mode**: Preview (Dry Run / No-op) — No tags or releases created in this run."
            else
              echo "**Mode**: Production Execution"
            fi
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Target Branch | \`$TARGET\` |"
            echo "| Next Version | \`${VERSION:-None}\` |"
            echo "| Git Tag | \`${TAG:-None}\` |"
            echo "| Will Release? | \`$RELEASED\` |"
            echo "| Is Prerelease? | \`$IS_PRERELEASE\` |"
            echo ""
            if [ "$RELEASED" = "true" ]; then
              echo "#### 📦 Actions on Merge to \`$TARGET\`:"
              echo "- Git tag \`$TAG\` will be created."
              echo "- Release notes and \`CHANGELOG.md\` will be published."
              if [ "$IS_PRERELEASE" = "true" ]; then
                echo "- Container \`$ORG/ufschem-spack-base-ubuntu-gcc-13-dev:$VERSION\` will be built/pushed."
                echo "- Docker tag \`:latest\` will **not** be updated (develop prerelease candidate)."
              else
                echo "- Container \`$ORG/ufschem-spack-base-ubuntu-gcc-13:$VERSION\` will be built/pushed."
                echo "- Docker tag \`:latest\` will be updated to \`$VERSION\`."
              fi
            else
              echo "#### ℹ️ No release will be triggered on merge based on current commit history."
              echo "*(Note: If you squash-merge using a conventional PR title such as \`feat: ...\` or \`fix: ...\`,*"
              echo "*that squashed commit will trigger a release upon merge.)*"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Post or Update PR Comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |-
            const target = "${{ steps.eval.outputs.target_branch }}";
            const version = "${{ steps.release.outputs.version }}";
            const tag = "${{ steps.release.outputs.tag }}";
            const released = "${{ steps.release.outputs.released }}";
            const isPrerelease = "${{ steps.eval.outputs.is_prerelease }}";
            const org = "${{ vars.DOCKER_ORG || 'bkrlps' }}";
            const marker = "<!-- semantic-release-preview-comment -->";
            let body = `${marker}\n### 🚀 Semantic Release Preview\n\n`;
            body += `This PR will be evaluated against **\`${target}\`** when merged.\n\n`;
            body += `| Parameter | Value |\n`;
            body += `|---|---|\n`;
            body += `| **Target Branch** | \`${target}\` |\n`;
            body += `| **Next Version** | \`${version || 'None'}\` |\n`;
            body += `| **Git Tag** | \`${tag || 'None'}\` |\n`;
            body += `| **Will Release?** | \`${released}\` |\n`;
            body += `| **Is Prerelease?** | \`${isPrerelease}\` |\n\n`;
            if (released === 'true') {
              body += `#### 📦 Planned Actions Upon Merge to \`${target}\`:\n`;
              body += `- Create Git tag \`${tag}\`\n`;
              body += `- Publish GitHub Release and update \`CHANGELOG.md\`\n`;
              if (isPrerelease === 'true') {
                body += `- Build & push: \`${org}/ufschem-spack-base-ubuntu-gcc-13-dev:${version}\`\n`;
                body += `- Docker tag \`:latest\` will **not** be moved (develop candidate)\n`;
              } else {
                body += `- Build & push: \`${org}/ufschem-spack-base-ubuntu-gcc-13:${version}\`\n`;
                body += `- Docker tag \`:latest\` will be updated to \`${version}\`\n`;
              }
            } else {
              body += `#### ℹ️ No release will be triggered upon merge based on current commit history.\n`;
              body += `*(Squash-merging with a conventional PR title such as \`feat: ...\` will trigger release.)*\n`;
            }
            const issueNumber = context.issue.number ||
              (context.payload.pull_request && context.payload.pull_request.number);
            if (!issueNumber) return;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const botComment = comments.find(c => c.body && c.body.includes(marker));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body,
              });
            }
