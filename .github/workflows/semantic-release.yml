name: Semantic Release
on:
  workflow_call:
    inputs:
      dry_run:
        description: Run in preview / no-operation mode without tagging or pushing
        required: false
        type: boolean
        default: false
      target_branch:
        description: Target branch name for evaluating release rules (e.g. develop, main)
        required: false
        type: string
        default: ''
      pr_title:
        description: Pull Request title representing the squash merge commit message
        required: false
        type: string
        default: ''
    outputs:
      new_release_version:
        description: The version of the new release
        value: ${{ jobs.release.outputs.new_release_version }}
      new_release_published:
        description: Whether a new release was published
        value: ${{ jobs.release.outputs.new_release_published }}
      is_prerelease:
        description: Whether this is a pre-release
        value: ${{ jobs.release.outputs.is_prerelease }}
      tag:
        description: The Git tag of the release
        value: ${{ jobs.release.outputs.tag }}
jobs:
  verify-credentials:
    name: Verify Semantic Release Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets presence
        env:
          SEMVER_APP_ID: ${{ secrets.SEMVER_APP_ID }}
          SEMVER_APP_PRIVATE_KEY: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}
        run: |
          MISSING=""
          [ -z "$SEMVER_APP_ID" ] && MISSING="${MISSING} SEMVER_APP_ID"
          [ -z "$SEMVER_APP_PRIVATE_KEY" ] && MISSING="${MISSING} SEMVER_APP_PRIVATE_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required Semantic Release repository secrets:${MISSING}"
            exit 1
          fi
          python3 -c "
          import os, sys
          key = os.environ.get('SEMVER_APP_PRIVATE_KEY', '').strip()
          if key.endswith('.pem') or key.startswith('/') or key.startswith('~'):
              print('::error::SEMVER_APP_PRIVATE_KEY is a file path. Paste file contents instead.')
              sys.exit(1)
          if '-----BEGIN' not in key or '-----END' not in key:
              print('::error::SEMVER_APP_PRIVATE_KEY missing BEGIN/END RSA PRIVATE KEY markers.')
              sys.exit(1)
          if (key.startswith('\"') and key.endswith('\"')) or (key.startswith(\"'\") and key.endswith(\"'\")):
              print('::error::SEMVER_APP_PRIVATE_KEY wrapped in quotes. Remove quotes in Secrets.')
              sys.exit(1)
          "
          echo "All required Semantic Release secrets are present and formatted."
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SEMVER_APP_ID }}
          private-key: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}
      - name: Verify repository write and ref permissions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.base_ref || github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Verifying GitHub App permissions for ${REPO}..."
          PERMS=$(gh api "repos/${REPO}" --jq '.permissions')
          CAN_PUSH=$(echo "$PERMS" | jq -r '.push // false')
          if [ "$CAN_PUSH" != "true" ]; then
            echo "::error::GitHub App does not have push permissions for ${REPO}. Granted: ${PERMS}"
            exit 1
          fi
          echo "Repository push permission confirmed."
          TEST_REF="tags/ci-perm-check-${RUN_ID}"
          SHA="${{ github.sha }}"
          echo "Testing Git ref creation (${TEST_REF})..."
          if ! gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/${TEST_REF}" -f sha="${SHA}" >/dev/null 2>&1; then
            echo "::error::Failed to create test Git ref on ${REPO}. Verify App has 'Contents: Read and write'."
            exit 1
          fi
          echo "Git ref creation succeeded. Cleaning up test ref..."
          gh api -X DELETE "repos/${REPO}/git/refs/${TEST_REF}" >/dev/null 2>&1 || true
          echo "Checking branch ruleset bypass configuration for target: ${TARGET_BRANCH}..."
          APP_ID=$(gh api "/app" --jq '.id' 2>/dev/null || echo "${{ secrets.SEMVER_APP_ID }}")
          RULESETS=$(gh api "repos/${REPO}/rulesets" --jq '.[].id' 2>/dev/null || true)
          for RS_ID in $RULESETS; do
            RS_DETAIL=$(gh api "repos/${REPO}/rulesets/${RS_ID}")
            HAS_PR=$(echo "$RS_DETAIL" | jq '[.rules[] | select(.type=="pull_request")] | length > 0')
            if [ "$HAS_PR" = "true" ]; then
              RS_NAME=$(echo "$RS_DETAIL" | jq -r '.name')
              IS_BYPASSED=false
              BYPASS_IDS=$(echo "$RS_DETAIL" | \
                jq -r '.bypass_actors[]? | select(.actor_type=="Integration") | .actor_id')
              for ACTOR_ID in $BYPASS_IDS; do
                if [ "$ACTOR_ID" = "$APP_ID" ]; then
                  IS_BYPASSED=true
                  break
                fi
              done
              if [ "$IS_BYPASSED" = "true" ]; then
                echo "Ruleset '${RS_NAME}' (ID: ${RS_ID}) includes GitHub App in bypass list."
              else
                echo "::warning::Ruleset '${RS_NAME}' requires PRs; App (ID: ${APP_ID}) not in bypass list."
              fi
            fi
          done
          echo "Semantic release credential verification completed successfully."
  release:
    name: Semantic Release
    needs:
      - verify-credentials
    runs-on: ubuntu-latest
    outputs:
      new_release_version: ${{ steps.release.outputs.version }}
      new_release_published: ${{ steps.release.outputs.released }}
      is_prerelease: ${{ steps.eval.outputs.is_prerelease }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SEMVER_APP_ID }}
          private-key: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - name: Prepare branch for release evaluation
        if: inputs.dry_run || github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ inputs.pr_title }}
        run: |
          TARGET="${{ inputs.target_branch || github.base_ref || github.ref_name }}"
          echo "Evaluating release against target branch: $TARGET"
          git checkout -B "$TARGET"
          if [ -n "$PR_TITLE" ]; then
            echo "Applying synthetic squash-merge commit from PR title: $PR_TITLE"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "$PR_TITLE"
          fi
      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v10
        id: release
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          no_operation_mode: ${{ inputs.dry_run || github.event_name == 'pull_request' }}
      - name: Evaluate Release Information
        id: eval
        if: always()
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          RELEASED="${{ steps.release.outputs.released }}"
          TARGET="${{ inputs.target_branch || github.base_ref || github.ref_name }}"
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *"-"* ]] || [[ "$TARGET" == "develop" ]]; then
            IS_PRERELEASE="true"
          fi
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET" >> "$GITHUB_OUTPUT"
      - name: Report Release Actions
        if: always()
        run: |-
          TARGET="${{ steps.eval.outputs.target_branch }}"
          VERSION="${{ steps.release.outputs.version }}"
          TAG="${{ steps.release.outputs.tag }}"
          RELEASED="${{ steps.release.outputs.released }}"
          IS_PRERELEASE="${{ steps.eval.outputs.is_prerelease }}"
          ORG="${{ secrets.DOCKER_ORG }}"
          REPORT_FILE=$(mktemp)
          {
            echo "### 🚀 Semantic Release Plan"
            if [ "${{ inputs.dry_run || github.event_name == 'pull_request' }}" = "true" ]; then
              echo "**Mode**: Preview (Dry Run / No-op) — No tags or releases created in this run."
            else
              echo "**Mode**: Production Execution"
            fi
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Target Branch | \`$TARGET\` |"
            echo "| Next Version | \`${VERSION:-None}\` |"
            echo "| Git Tag | \`${TAG:-None}\` |"
            echo "| Will Release? | \`$RELEASED\` |"
            echo "| Is Prerelease? | \`$IS_PRERELEASE\` |"
            echo ""
            if [ "$RELEASED" = "true" ]; then
              echo "#### 📦 Actions on Merge to \`$TARGET\`:"
              echo "- Git tag \`$TAG\` will be created."
              echo "- Release notes and \`CHANGELOG.md\` will be published."
              if [ "$IS_PRERELEASE" = "true" ]; then
                echo "- Container \`${ORG:+$ORG/}ufschem-spack-base-ubuntu-gcc-13-dev:$VERSION\` will be built/pushed."
                echo "- Docker tag \`:latest\` will **not** be updated (develop prerelease candidate)."
              else
                echo "- Container \`${ORG:+$ORG/}ufschem-spack-base-ubuntu-gcc-13:$VERSION\` will be built/pushed."
                echo "- Docker tag \`:latest\` will be updated to \`$VERSION\`."
              fi
            else
              echo "#### ℹ️ No release will be triggered on merge based on current commit history."
            fi
          } > "$REPORT_FILE"
          cat "$REPORT_FILE"
          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
