name: Semantic Release
on:
  workflow_call:
    inputs:
      dry_run:
        description: Run in preview / no-operation mode without tagging or pushing
        required: false
        type: boolean
        default: false
      target_branch:
        description: Target branch name for evaluating release rules (e.g. develop, main)
        required: false
        type: string
        default: ''
      pr_title:
        description: Pull Request title representing the squash merge commit message
        required: false
        type: string
        default: ''
    outputs:
      new_release_version:
        description: The version of the new release
        value: ${{ jobs.release.outputs.new_release_version }}
      new_release_published:
        description: Whether a new release was published
        value: ${{ jobs.release.outputs.new_release_published }}
      is_prerelease:
        description: Whether this is a pre-release
        value: ${{ jobs.release.outputs.is_prerelease }}
      tag:
        description: The Git tag of the release
        value: ${{ jobs.release.outputs.tag }}
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new_release_version: ${{ steps.release.outputs.version }}
      new_release_published: ${{ steps.release.outputs.released }}
      is_prerelease: ${{ steps.eval.outputs.is_prerelease }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        if: ${{ env.HAS_APP_ID == 'true' }}
        env:
          HAS_APP_ID: ${{ secrets.SEMVER_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SEMVER_APP_ID }}
          private-key: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - name: Prepare branch for release evaluation
        if: inputs.dry_run || github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ inputs.pr_title }}
        run: |
          TARGET="${{ inputs.target_branch || github.base_ref || github.ref_name }}"
          echo "Evaluating release against target branch: $TARGET"
          git checkout -B "$TARGET"
          if [ -n "$PR_TITLE" ]; then
            echo "Applying synthetic squash-merge commit from PR title: $PR_TITLE"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "$PR_TITLE"
          fi
      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v10
        id: release
        with:
          github_token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          no_operation_mode: ${{ inputs.dry_run || github.event_name == 'pull_request' }}
      - name: Evaluate Release Information
        id: eval
        if: always()
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          RELEASED="${{ steps.release.outputs.released }}"
          TARGET="${{ inputs.target_branch || github.base_ref || github.ref_name }}"
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *"-"* ]] || [[ "$TARGET" == "develop" ]]; then
            IS_PRERELEASE="true"
          fi
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET" >> "$GITHUB_OUTPUT"
      - name: Report Release Actions
        if: always()
        run: |-
          TARGET="${{ steps.eval.outputs.target_branch }}"
          VERSION="${{ steps.release.outputs.version }}"
          TAG="${{ steps.release.outputs.tag }}"
          RELEASED="${{ steps.release.outputs.released }}"
          IS_PRERELEASE="${{ steps.eval.outputs.is_prerelease }}"
          ORG="${{ secrets.DOCKER_ORG }}"
          REPORT_FILE=$(mktemp)
          {
            echo "### 🚀 Semantic Release Plan"
            if [ "${{ inputs.dry_run || github.event_name == 'pull_request' }}" = "true" ]; then
              echo "**Mode**: Preview (Dry Run / No-op) — No tags or releases created in this run."
            else
              echo "**Mode**: Production Execution"
            fi
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Target Branch | \`$TARGET\` |"
            echo "| Next Version | \`${VERSION:-None}\` |"
            echo "| Git Tag | \`${TAG:-None}\` |"
            echo "| Will Release? | \`$RELEASED\` |"
            echo "| Is Prerelease? | \`$IS_PRERELEASE\` |"
            echo ""
            if [ "$RELEASED" = "true" ]; then
              echo "#### 📦 Actions on Merge to \`$TARGET\`:"
              echo "- Git tag \`$TAG\` will be created."
              echo "- Release notes and \`CHANGELOG.md\` will be published."
              if [ "$IS_PRERELEASE" = "true" ]; then
                echo "- Container \`${ORG:+$ORG/}ufschem-spack-base-ubuntu-gcc-13-dev:$VERSION\` will be built/pushed."
                echo "- Docker tag \`:latest\` will **not** be updated (develop prerelease candidate)."
              else
                echo "- Container \`${ORG:+$ORG/}ufschem-spack-base-ubuntu-gcc-13:$VERSION\` will be built/pushed."
                echo "- Docker tag \`:latest\` will be updated to \`$VERSION\`."
              fi
            else
              echo "#### ℹ️ No release will be triggered on merge based on current commit history."
            fi
          } > "$REPORT_FILE"
          cat "$REPORT_FILE"
          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
