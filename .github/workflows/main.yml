name: main
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: write
  id-token: write
jobs:
  check-sandbox:
    name: Check Sandbox Configuration
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/check-sandbox.yml
    with:
      is_labeled_sandbox: ${{ contains(github.event.pull_request.labels.*.name, 'sandbox-build') }}
      pr_body: ${{ github.event.pull_request.body || '' }}
  lint:
    name: Lint & Title Check
    uses: ./.github/workflows/lint.yml
    with:
      pr_title: ${{ github.event.pull_request.title || '' }}
  release-preview:
    name: Semantic Release Preview
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/semantic-release.yml
    with:
      dry_run: true
      target_branch: ${{ github.base_ref || github.ref_name }}
      pr_title: ${{ github.event.pull_request.title || '' }}
    secrets: inherit
  build-test:
    name: Container Build Verification
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs:
      - lint
      - check-sandbox
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: spack-base
            dockerfile: ./docker/Dockerfile.ufschem-spack-base-ubuntu-gcc-13
            image_name: ufschem-spack-base-ubuntu-gcc-13
    uses: ./.github/workflows/docker-build.yml
    with:
      target_name: ${{ matrix.target_name }}
      dockerfile: ${{ matrix.dockerfile }}
      image_name: ${{ matrix.image_name }}
      is_sandbox: ${{ needs.check-sandbox.outputs.is_sandbox == 'true' }}
      sandbox_version: ${{ needs.check-sandbox.outputs.sandbox_version }}
    secrets: inherit
  release:
    name: Semantic Release
    if: >-
      github.repository == 'ufs-community/ufs-chem-container' &&
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'Automatically generated by python-semantic-release')
    needs:
      - lint
    uses: ./.github/workflows/semantic-release.yml
    with:
      dry_run: false
      target_branch: ${{ github.ref_name }}
    secrets: inherit
  docker-release:
    name: Publish Container Images
    needs:
      - release
    if: >-
      github.repository == 'ufs-community/ufs-chem-container' &&
      needs.release.outputs.new_release_published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: spack-base
            dockerfile: ./docker/Dockerfile.ufschem-spack-base-ubuntu-gcc-13
            image_name_prod: ufschem-spack-base-ubuntu-gcc-13
            image_name_dev: ufschem-spack-base-ubuntu-gcc-13-dev
    uses: ./.github/workflows/docker-release.yml
    with:
      release_version: ${{ needs.release.outputs.new_release_version }}
      is_prerelease: ${{ needs.release.outputs.is_prerelease }}
      target_name: ${{ matrix.target_name }}
      dockerfile: ${{ matrix.dockerfile }}
      image_name: >-
        ${{ needs.release.outputs.is_prerelease == 'true' &&
            matrix.image_name_dev ||
            matrix.image_name_prod }}
    secrets: inherit
