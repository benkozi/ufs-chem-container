name: Pull Request CI
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - edited
    branches:
      - main
      - develop
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check-sandbox:
    name: Check Sandbox Configuration
    runs-on: ubuntu-latest
    outputs:
      is_sandbox: ${{ steps.evaluate.outputs.is_sandbox }}
      sandbox_version: ${{ steps.evaluate.outputs.sandbox_version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Evaluate sandbox requirements
        id: evaluate
        env:
          IS_LABELED_SANDBOX: ${{ contains(github.event.pull_request.labels.*.name, 'sandbox-build') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 .github/workflows/scripts/check_sandbox_config.py
  lint:
    name: Lint & Title Check
    uses: ./.github/workflows/lint.yml
    with:
      pr_title: ${{ github.event.pull_request.title }}
  release-preview:
    name: Semantic Release Preview
    uses: ./.github/workflows/semantic-release.yml
    with:
      dry_run: true
      target_branch: ${{ github.base_ref }}
      pr_title: ${{ github.event.pull_request.title }}
    secrets: inherit
  build-test:
    name: Container Build Verification
    needs:
      - lint
      - check-sandbox
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: spack-base
            dockerfile: ./docker/Dockerfile.ufschem-spack-base-ubuntu-gcc-13
            image_name: ufschem-spack-base-ubuntu-gcc-13
    uses: ./.github/workflows/docker-build.yml
    with:
      target_name: ${{ matrix.target_name }}
      dockerfile: ${{ matrix.dockerfile }}
      image_name: ${{ matrix.image_name }}
      is_sandbox: ${{ needs.check-sandbox.outputs.is_sandbox == 'true' }}
      sandbox_version: ${{ needs.check-sandbox.outputs.sandbox_version }}
    secrets: inherit
