name: Build and test (Docker image)
on:
  workflow_call:
    inputs:
      target_name:
        description: The target scope identifier for caching
        required: true
        type: string
      dockerfile:
        description: Path to Dockerfile
        required: true
        type: string
      context:
        description: Docker build context path
        required: false
        type: string
        default: .
      build_args:
        description: Build arguments
        required: false
        type: string
        default: ''
      image_name:
        description: The image name for tagging and registry fallback
        required: true
        type: string
  workflow_dispatch:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Start local registry
        run: |
          docker run -d -p 5000:5000 --name registry registry:2
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: localhost:5000/${{ inputs.image_name }}:latest
          platforms: linux/amd64
          build-args: ${{ inputs.build_args }}
          cache-from: |
            type=gha,scope=${{ inputs.target_name }}
            type=registry,ref=${{ secrets.DOCKER_ORG }}/${{ inputs.image_name }}:latest
          cache-to: |-
            type=gha,scope=${{ inputs.target_name }},mode=max
            type=inline
