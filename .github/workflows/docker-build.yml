name: Build and test (Docker image)
on:
  workflow_call:
    inputs:
      target_name:
        description: The target scope identifier for caching
        required: true
        type: string
      dockerfile:
        description: Path to Dockerfile
        required: true
        type: string
      context:
        description: Docker build context path
        required: false
        type: string
        default: .
      build_args:
        description: Build arguments
        required: false
        type: string
        default: ''
      image_name:
        description: The image name for tagging and registry fallback
        required: true
        type: string
      is_sandbox:
        description: Whether to build and publish a sandbox image
        required: false
        type: boolean
        default: false
      sandbox_version:
        description: Version tag for sandbox build
        required: false
        type: string
        default: ''
  workflow_dispatch:
jobs:
  verify-credentials:
    name: Verify Docker Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Validate secrets presence
        id: check
        env:
          DOCKER_ORG: ${{ secrets.DOCKER_ORG }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 .github/workflows/scripts/verify_docker_credentials.py check-secrets \
            ${{ inputs.is_sandbox == false && '--allow-missing' || '' }}
      - name: Log in to Docker Hub
        if: steps.check.outputs.skip_verification != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify registry push authorization
        if: steps.check.outputs.skip_verification != 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_ORG: ${{ secrets.DOCKER_ORG }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IS_SANDBOX: ${{ inputs.is_sandbox }}
        run: |
          if [ "$IS_SANDBOX" = "true" ]; then
            REPOS="${DOCKER_ORG}/${IMAGE_NAME}-sandbox"
          else
            REPOS="${DOCKER_ORG}/${IMAGE_NAME} ${DOCKER_ORG}/${IMAGE_NAME}-dev"
          fi
          python3 .github/workflows/scripts/verify_docker_credentials.py check-push \
            --repositories $REPOS
  build-test:
    name: Build and Test Image
    needs:
      - verify-credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Configure build destination and tags
        id: config
        env:
          IS_SANDBOX: ${{ inputs.is_sandbox }}
          DOCKER_ORG: ${{ secrets.DOCKER_ORG }}
          IMAGE_NAME: ${{ inputs.image_name }}
          SANDBOX_VERSION: ${{ inputs.sandbox_version }}
        run: |
          if [ "$IS_SANDBOX" = "true" ]; then
            REPO="${DOCKER_ORG}/${IMAGE_NAME}-sandbox"
            TAGS="${REPO}:${SANDBOX_VERSION}"
            SANDBOX_CACHE="type=registry,ref=${REPO}:${SANDBOX_VERSION}"
            {
              echo "tags<<EOF"
              echo "$TAGS"
              echo "EOF"
              echo "sandbox_cache<<EOF"
              echo "$SANDBOX_CACHE"
              echo "EOF"
              echo "push_to_hub=true"
            } >> "$GITHUB_OUTPUT"
            echo "Configured build to publish sandbox image to Docker Hub repository: ${REPO}"
          else
            {
              echo "tags=localhost:5000/${IMAGE_NAME}:latest"
              echo "sandbox_cache="
              echo "push_to_hub=false"
            } >> "$GITHUB_OUTPUT"
            echo "Configured build for local verification registry."
          fi
      - name: Start local registry
        if: steps.config.outputs.push_to_hub != 'true'
        run: |
          docker run -d -p 5000:5000 --name registry registry:2
      - name: Log in to Docker Hub
        if: steps.config.outputs.push_to_hub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.config.outputs.tags }}
          platforms: linux/amd64
          build-args: ${{ inputs.build_args }}
          cache-from: |
            type=gha,scope=${{ inputs.target_name }}
            ${{ steps.config.outputs.sandbox_cache }}
            type=registry,ref=${{ secrets.DOCKER_ORG || 'noaaepic' }}/${{ inputs.image_name }}-dev:latest
            type=registry,ref=${{ secrets.DOCKER_ORG || 'noaaepic' }}/${{ inputs.image_name }}:latest
          cache-to: |-
            type=gha,scope=${{ inputs.target_name }},mode=max
            type=inline
