name: Verify Repository Secrets
on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: verify-secrets
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-docker-credentials:
    name: Verify Docker Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Validate Docker secrets presence
        env:
          DOCKER_ORG: ${{ secrets.DOCKER_ORG }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          MISSING=""
          [ -z "$DOCKER_ORG" ] && MISSING="${MISSING} DOCKER_ORG"
          [ -z "$DOCKER_USERNAME" ] && MISSING="${MISSING} DOCKER_USERNAME"
          [ -z "$DOCKERHUB_TOKEN" ] && MISSING="${MISSING} DOCKERHUB_TOKEN"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required Docker repository secrets:${MISSING}"
            exit 1
          fi
          echo "All required Docker secrets are present: DOCKER_ORG=$DOCKER_ORG, DOCKER_USERNAME=$DOCKER_USERNAME"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify registry push authorization
        env:
          DOCKER_ORG: ${{ secrets.DOCKER_ORG }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          check_push_access() {
            local repo="$1"
            echo "Checking push permissions for repository: ${repo}..."
            local token_resp
            token_resp=$(curl -s -u "${DOCKER_USERNAME}:${DOCKERHUB_TOKEN}" \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:push,pull")
            local token
            token=$(echo "$token_resp" | jq -r '.token // .access_token // empty')
            if [ -z "$token" ]; then
              echo "::error::Failed to obtain Docker auth token for ${repo}: ${token_resp}"
              return 1
            fi
            local upload_resp http_code
            upload_resp=$(curl -s -i -X POST "https://registry-1.docker.io/v2/${repo}/blobs/uploads/" \
              -H "Authorization: Bearer ${token}")
            http_code=$(echo "$upload_resp" | grep -i "^HTTP/" | tail -n1 | awk '{print $2}')
            if [ "$http_code" -eq 202 ]; then
              echo "Push access successfully verified for ${repo} (HTTP 202 Accepted)."
              local upload_url
              upload_url=$(echo "$upload_resp" | grep -i "^location:" | awk '{print $2}' | tr -d '\r')
              if [ -n "$upload_url" ]; then
                case "$upload_url" in
                  http*)
                    del_url="$upload_url"
                    ;;
                  *)
                    del_url="https://registry-1.docker.io${upload_url}"
                    ;;
                esac
                curl -s -X DELETE "$del_url" \
                  -H "Authorization: Bearer ${token}" >/dev/null 2>&1 || true
              fi
              return 0
            else
              echo "::error::Registry push check failed for ${repo} (HTTP ${http_code}):"
              echo "$upload_resp"
              return 1
            fi
          }

          echo "Verifying push access across all target repositories..."
          check_push_access "${DOCKER_ORG}/ufschem-spack-base-ubuntu-gcc-13"
          check_push_access "${DOCKER_ORG}/ufschem-spack-base-ubuntu-gcc-13-dev"
          check_push_access "${DOCKER_ORG}/ufschem-spack-base-ubuntu-gcc-13-sandbox"
          echo "All Docker Hub repositories verified successfully for organization: ${DOCKER_ORG}"

  verify-semantic-release-credentials:
    name: Verify Semantic Release Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Validate Semantic Release secrets presence & format
        env:
          SEMVER_APP_ID: ${{ secrets.SEMVER_APP_ID }}
          SEMVER_APP_PRIVATE_KEY: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}
        run: |
          MISSING=""
          [ -z "$SEMVER_APP_ID" ] && MISSING="${MISSING} SEMVER_APP_ID"
          [ -z "$SEMVER_APP_PRIVATE_KEY" ] && MISSING="${MISSING} SEMVER_APP_PRIVATE_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required Semantic Release repository secrets:${MISSING}"
            exit 1
          fi
          python3 -c "
          import os, sys
          key = os.environ.get('SEMVER_APP_PRIVATE_KEY', '').strip()
          if key.endswith('.pem') or key.startswith('/') or key.startswith('~'):
              print('::error::SEMVER_APP_PRIVATE_KEY is a file path. Paste file contents instead.')
              sys.exit(1)
          if '-----BEGIN' not in key or '-----END' not in key:
              print('::error::SEMVER_APP_PRIVATE_KEY missing BEGIN/END RSA PRIVATE KEY markers.')
              sys.exit(1)
          if (key.startswith('\"') and key.endswith('\"')) or (key.startswith(\"'\") and key.endswith(\"'\")):
              print('::error::SEMVER_APP_PRIVATE_KEY wrapped in quotes. Remove quotes in Secrets.')
              sys.exit(1)
          "
          echo "All required Semantic Release secrets are present and formatted properly."

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SEMVER_APP_ID }}
          private-key: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}

      - name: Verify repository write and ref permissions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Verifying GitHub App permissions for ${REPO}..."
          ACCESSIBLE=$(gh api "/installation/repositories" \
            --jq '[.repositories[].full_name] | contains(["'${REPO}'"])')
          if [ "$ACCESSIBLE" != "true" ]; then
            echo "::error::GitHub App is not installed on repository ${REPO}."
            exit 1
          fi
          echo "GitHub App repository access confirmed."

          TEST_REF="tags/ci-perm-check-${RUN_ID}"
          SHA="${{ github.sha }}"
          echo "Testing Git ref creation (${TEST_REF})..."
          if ! gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/${TEST_REF}" -f sha="${SHA}" >/dev/null 2>&1; then
            echo "::error::Failed to create test Git ref on ${REPO}. Verify App has 'Contents: Read and write'."
            exit 1
          fi
          echo "Git ref creation succeeded. Cleaning up test ref..."
          gh api -X DELETE "repos/${REPO}/git/refs/${TEST_REF}" >/dev/null 2>&1 || true

          check_ruleset_bypass() {
            local branch="$1"
            echo "Checking branch ruleset bypass configuration for branch: ${branch}..."
            APP_ID="${{ secrets.SEMVER_APP_ID }}"
            APP_SLUG="${{ steps.app-token.outputs.app-slug }}"
            RULESETS=$(gh api "repos/${REPO}/rulesets" --jq '.[].id' 2>/dev/null || true)
            for RS_ID in $RULESETS; do
              RS_DETAIL=$(gh api "repos/${REPO}/rulesets/${RS_ID}")
              HAS_PR=$(echo "$RS_DETAIL" | jq '[.rules[] | select(.type=="pull_request")] | length > 0')
              if [ "$HAS_PR" = "true" ]; then
                RS_NAME=$(echo "$RS_DETAIL" | jq -r '.name')
                CAN_BYPASS=$(echo "$RS_DETAIL" | jq -r '.current_user_can_bypass // "never"')
                IS_BYPASSED=false
                if [ "$CAN_BYPASS" = "always" ]; then
                  IS_BYPASSED=true
                fi
                BYPASS_INTEGRATIONS=$(echo "$RS_DETAIL" | \
                  jq -r '.bypass_actors[]? | select(.actor_type=="Integration" and .bypass_mode=="always") | .actor_id')
                if [ -n "$BYPASS_INTEGRATIONS" ]; then
                  IS_BYPASSED=true
                fi
                if [ "$IS_BYPASSED" = "true" ]; then
                  echo "Ruleset '${RS_NAME}' (ID: ${RS_ID}) includes App (${APP_SLUG}) in bypass list for ${branch}."
                else
                  echo "::warning::Ruleset '${RS_NAME}' requires PRs on ${branch}; App not in bypass list."
                fi
              fi
            done
          }

          check_ruleset_bypass "develop"
          check_ruleset_bypass "main"
          echo "Semantic release credential verification completed successfully."
